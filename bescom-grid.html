  .spin-slow { animation: spinSlow 8s linear infinite; transform-origin: center; }
  .fade-in { animation: fadeInUp .35s ease-out both; }
  .blip { animation: blip 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }

/* ---------------------------------------------------------------------
   Graph engine — power flow recompute + downstream analysis
--------------------------------------------------------------------- */
function clone(g) {
  return JSON.parse(JSON.stringify(g));
}
function buildAdjacency(edges) {
  const adj = {};
  edges.forEach(e => {
    const blocked = e.status === 'faulted' || e.switchState === 'open';
    if (!blocked) {
      (adj[e.from] = adj[e.from] || []).push({
        edge: e,
        to: e.to
      });
      if (e.isTie) (adj[e.to] = adj[e.to] || []).push({
        edge: e,
        to: e.from
      });
    }
  });
  return adj;
}
function computePoweredSet(grid) {
  const adj = buildAdjacency(grid.edges);
  const powered = new Set();
  const via = {};
  const q = grid.nodes.filter(n => n.type === 'substation').map(n => n.id);
  q.forEach(id => powered.add(id));
  while (q.length) {
    const cur = q.shift();
    (adj[cur] || []).forEach(({
      edge,
      to
    }) => {
      if (!powered.has(to)) {
        powered.add(to);
        via[to] = edge.id;
        q.push(to);
      }
    });
  }
  return {
    powered,
    via
  };
}
function downstreamNodes(grid, fromEdgeId) {
  // nodes downstream of the given edge, ignoring tie (open) and faulted edges
  const start = grid.edges.find(e => e.id === fromEdgeId);
  if (!start) return [];
  const adj = {};
  grid.edges.forEach(e => {
    if (e.id === fromEdgeId) return;
    if (e.status === 'faulted' || e.switchState === 'open') return;
    (adj[e.from] = adj[e.from] || []).push(e.to);
    if (e.isTie) (adj[e.to] = adj[e.to] || []).push(e.from);
  });
  const seen = new Set([start.to]);
  const q = [start.to];
  while (q.length) {
    const c = q.shift();
    (adj[c] || []).forEach(t => {
      if (!seen.has(t)) {
        seen.add(t);
        q.push(t);
      }
    });
  }
  return [...seen];
}
function recomputeGrid(grid) {
  const {
    powered
  } = computePoweredSet(grid);
  // Edge visual status
  grid.edges.forEach(e => {
    if (e.status === 'faulted') return;
    if (grid.restorationPath.includes(e.id)) {
      e.status = 'restoration';
      return;
    }
    if (e.isTie && e.switchState === 'open') {
      e.status = 'isolated';
      return;
    }
    const toPowered = powered.has(e.to);
    if (!toPowered) {
      e.status = 'isolated';
    } else {
      const lp = e.telemetry.loadPct;
      e.status = lp >= 90 ? 'warning' : lp >= 78 ? 'warning' : 'healthy';
    }
  });
  // Node powered + telemetry zeroing for isolated
  grid.nodes.forEach(n => {
    n.powered = powered.has(n.id);
  });
  grid.edges.forEach(e => {
    if (e.status === 'isolated' || e.status === 'faulted') {
      if (e.status === 'faulted') {/* keep spike set by trigger */} else {
        e.telemetry.voltageKV = 0;
        e.telemetry.currentA = 0;
        e.telemetry.loadPct = 0;
        e.telemetry.powerMW = 0;
      }
    }
  });
  // Affected areas
  grid.affectedAreas = grid.nodes.filter(n => n.type === 'consumer' && !powered.has(n.id)).map(n => ({
    id: n.id,
    name: n.name,
    consumers: n.consumers,
    loadMW: n.loadMW,
    tag: n.tag
  }));
  // KPIs
  const totalEdges = grid.edges.filter(e => !e.isTie).length;
  const healthyEdges = grid.edges.filter(e => !e.isTie && e.status === 'healthy').length;
  const activeFeeders = grid.nodes.filter(n => n.type === 'feeder' && powered.has(n.id)).length;
  const affectedConsumers = grid.affectedAreas.reduce((s, a) => s + a.consumers, 0);
  const restored = grid.events.filter(ev => ev.outcome === 'restored').length;
  const restoredDurations = grid.events.filter(ev => ev.outcome === 'restored' && ev.durationSec != null).map(ev => ev.durationSec);
  const avg = restoredDurations.length ? Math.round(restoredDurations.reduce((s, d) => s + d, 0) / restoredDurations.length) : 0;
  grid.kpis = {
    gridHealthPct: totalEdges ? Math.round(healthyEdges / totalEdges * 100) : 100,
    activeFeeders,
    affectedConsumers,
    avgRestorationSec: avg,
    totalFaults: grid.events.filter(ev => ev.type === 'fault').length,
    restoredFaults: restored
  };
  return grid;
}

    const g = this._init();
    // jitter powered edges, push feeder history
    g.edges.forEach(e => {
      if (e.isTie) return;
      if (e.status === 'healthy' || e.status === 'warning' || e.status === 'restoration') {
        const t = e.telemetry;
        const j = (v, p) => Math.max(0, v + (Math.random() - 0.5) * v * p);
        t.voltageKV = +(t.voltageKV * (1 + (Math.random() - 0.5) * 0.012)).toFixed(2);
        t.currentA = Math.round(j(t.currentA, 0.04));
        t.loadPct = Math.max(0, Math.min(100, Math.round(t.loadPct + (Math.random() - 0.5) * 2.2)));
        t.powerMW = +(t.currentA * t.voltageKV * 1.732 / 1000).toFixed(2);
        if (t.loadPct >= 78) e.status = 'warning';else if (e.status === 'warning') e.status = 'healthy';
      }
    });
    ['F1', 'F2', 'F3'].forEach(fid => {
      const fe = g.edges.find(e => (e.from === g.nodes.find(n => n.id === fid).feederOf || e.id === 'E-SUBA-F' + fid.slice(1)) && e.to === fid);
      const edge = g.edges.find(e => e.to === fid) || g.edges.find(e => e.from === fid);
      const src = edge ? edge.telemetry : {
        voltageKV: 0,
        currentA: 0,
        loadPct: 0,
        powerMW: 0
      };
      g.telemetryHistory[fid] = g.telemetryHistory[fid] || [];
      g.telemetryHistory[fid].push({
        t: NOW(),
        v: src.voltageKV,
        a: src.currentA,
        p: src.powerMW,
        load: src.loadPct
      });
      if (g.telemetryHistory[fid].length > 30) g.telemetryHistory[fid].shift();
    });
    this._store = recomputeGrid(g);
    return this._snap();
  },
  async triggerScenario(scenarioId) {
    const g = this._init();
    await this._delay(300);
    if (scenarioId === 'S3') {
      return this.resetGrid();
    }
    // clear previous active fault context
    g.activeFaultId = null;
    g.relaySequence = [];
    g.restorationPlan = null;
    g.restorationExecuted = false;
    g.restorationPath = [];
    // reset edges/switches to healthy base
    g.edges.forEach(e => {
      e.status = 'healthy';
      if (e.isTie) {
        e.switchState = 'open';
        e.status = 'isolated';
        e.telemetry = {
          voltageKV: 0,
          currentA: 0,
          loadPct: 0,
          powerMW: 0
        };
      }
    });
    // restore nominal telemetry
    const seed = clone(GRID_DATA_SEED).edges;
    g.edges.forEach(e => {
      const s = seed.find(x => x.id === e.id);
      if (s && !e.isTie) e.telemetry = clone(s.telemetry);
    });
    // restore node loads (Area D may have been spiked)
    const seedNodes = clone(GRID_DATA_SEED).nodes;
    g.nodes.forEach(n => {
      const s = seedNodes.find(x => x.id === n.id);
      if (s) n.loadMW = s.loadMW;
    });
    let faultEdgeId, faultType, severity, desc, affectedDesc;
    if (scenarioId === 'S1') {
      faultEdgeId = 'E-SUBA-F2';
      faultType = 'Overcurrent Fault (3-phase short)';
      severity = 'critical';
      desc = 'Permanent line fault on 33kV incomer Substation Alpha → Feeder F2. Protective relay tripped CB-A2. Areas B & C lose supply.';
      affectedDesc = 'Area B + Area C disconnected';
    } else if (scenarioId === 'S2') {
      faultEdgeId = 'E-SUBA-F2';
      faultType = 'Overcurrent Fault + Feeder F3 Thermal Overload (Double-fault / Peak Load)';
      severity = 'critical';
      desc = 'Line fault on A→F2 during system peak. Feeder F3 simultaneously at thermal limit (Area D load spiked). Tie restoration infeasible — no feasible route.';
      affectedDesc = 'Area B + Area C isolated; F3 at capacity';
      // spike Area D load → F3 near thermal limit
      const d = g.nodes.find(n => n.id === 'AREA-D');
      if (d) d.loadMW = 6.7;
      const f3d = g.edges.find(e => e.id === 'E-F3-DT104');
      if (f3d) {
        f3d.telemetry.loadPct = 94;
        f3d.telemetry.currentA = 540;
        f3d.telemetry.powerMW = 6.7;
      }
      const sbf3 = g.edges.find(e => e.id === 'E-SUBB-F3');
      if (sbf3) {
        sbf3.telemetry.loadPct = 92;
        sbf3.telemetry.currentA = 540;
        sbf3.telemetry.powerMW = 6.7;
      }
    } else {
      return {
        ok: false,
        error: 'Unknown scenario'
      };
    }
    const fe = g.edges.find(e => e.id === faultEdgeId);
    // fault telemetry: overcurrent spike then dead
    const spikeI = fe.telemetry.currentA * 14;
    fe.status = 'faulted';
    fe.telemetry = {
      voltageKV: +(fe.telemetry.voltageKV * 0.22).toFixed(2),
      currentA: Math.round(spikeI),
      loadPct: 100,
      powerMW: 0
    };
    const faultId = 'FLT-' + (g.faults.length + 1).toString().padStart(3, '0');
    const fault = {
      id: faultId,
      edgeId: faultEdgeId,
      edgeName: fe.name,
      type: faultType,
      severity,
      desc,
      affectedDesc,
      ts: NOW(),
      scenarioId
    };
    g.faults.unshift(fault);
    g.activeFaultId = faultId;
    g.statusPhase = 'fault_detected';

    // anomalies
    g.anomalies.unshift({
      id: 'AN-' + Math.random().toString(36).slice(2, 7),
      ts: NOW(),
      faultId,
      metric: 'Overcurrent',
      value: Math.round(spikeI) + ' A',
      threshold: Math.round(fe.telemetry.currentA / 14 * 1.2) + ' A',
      location: fe.name,
      severity
    });
    g.anomalies.unshift({
      id: 'AN-' + Math.random().toString(36).slice(2, 7),
      ts: NOW() + 30,
      faultId,
      metric: 'Undervoltage',
      value: fe.telemetry.voltageKV + ' kV',
      threshold: '29.7 kV',
      location: fe.name,
      severity: 'high'
    });

    // relay trip sequence
    g.relaySequence = [{
      t: 0,

      detail: faultType + ' on ' + fe.name,
      tag: 'fault'
    }, {
      t: 8,

    }];

  _buildPlan(g, fault) {
    // For fault on E-SUBA-F2 → restore Area B & C via Tie-Switch TS-1 from F3
    const tie = g.edges.find(e => e.id === 'E-TS1');
    const f3cap = g.nodes.find(n => n.id === 'F3').capacityMW;
    // current F3 load = Area D load (and any other on F3)
    const f3load = g.nodes.filter(n => n.id === 'AREA-D').reduce((s, n) => s + n.loadMW, 0);
    const restore = g.nodes.filter(n => ['AREA-B', 'AREA-C'].includes(n.id)).reduce((s, n) => s + n.loadMW, 0);
    const projected = f3load + restore;
    const feasible = projected <= f3cap;
    const margin = +(f3cap - projected).toFixed(2);
    const actions = [{
      id: 'a1',
      kind: 'open',
      target: 'SW-A2',
      desc: 'Open sectionaliser SW-A2 to confirm fault isolation on F2 incomer',
      reason: 'Lock out faulted segment'
    }, {
      id: 'a2',
      kind: 'close',
      target: 'TS-1',
      desc: 'Close normally-open tie-switch TS-1 (F2↔F3)',
      reason: 'Backfeed F2 downstream from Feeder F3'
    }];
    const path = feasible ? ['E-TS1', 'E-F2-DT102', 'E-F2-DT103', 'E-DT102-B', 'E-DT103-C'] : [];
    return {
      faultId: fault.id,
      strategy: feasible ? 'Tie-switch backfeed via Feeder F3' : 'No feasible alternative route',
      altFeeder: 'F3 (Substation Beta)',
      tieSwitch: 'TS-1',
      capacityCheck: {
        feeder: 'F3',
        capacityMW: f3cap,
        currentLoadMW: +f3load.toFixed(2),
        addedLoadMW: +restore.toFixed(2),
        projectedLoadMW: +projected.toFixed(2),
        marginMW: margin,
        result: feasible ? 'Pass' : 'Fail'
      },
      actions,
      restoreTargets: ['AREA-B', 'AREA-C'],
      restoreLoadMW: +restore.toFixed(2),
      feasible,
      pathEdgeIds: path
    };
  },
  async getRestorationPlan(faultId) {
    await this._delay(160);
    const s = this._snap();
    return s.restorationPlan;
  },
  async executeRestoration() {
    const g = this._init();
    await this._delay(500);
    const plan = g.restorationPlan;
    if (!plan) return {
      ok: false,
      error: 'No active restoration plan.'
    };
    if (!plan.feasible) {
      g.statusPhase = 'no_route';
      this._logEvent({
        type: 'restoration',
        faultId: plan.faultId,
        outcome: 'no_route',
        detail: 'No feasible route — alternative feeder exceeds thermal capacity. Manual dispatch required.'
      });
      this._store = recomputeGrid(g);
      return this._snap();
    }
    // execute switching
    const swA2 = g.edges.find(e => e.switch === 'SW-A2');
    if (swA2) swA2.switchState = 'open';
    const tie = g.edges.find(e => e.id === 'E-TS1');
    if (tie) {
      tie.switchState = 'closed';
      tie.telemetry = {
        voltageKV: 11.0,
        currentA: Math.round(plan.restoreLoadMW * 1000 / (11 * 1.732)),
        loadPct: Math.round(plan.restoreLoadMW / 8 * 100),
        powerMW: plan.restoreLoadMW
      };
    }
    g.restorationPath = plan.pathEdgeIds;
    g.restorationExecuted = true;
    g.statusPhase = 'restoring';
    // re-energise DT-102 / DT-103 path telemetry
    ['E-F2-DT102', 'E-F2-DT103', 'E-DT102-B', 'E-DT103-C'].forEach(eid => {
      const e = g.edges.find(x => x.id === eid);
      if (e && e.status !== 'faulted') {
        const seed = clone(GRID_DATA_SEED).edges.find(x => x.id === eid);
        if (seed) e.telemetry = clone(seed.telemetry);
      }
    });
    this._logEvent({
      type: 'switching',
      faultId: plan.faultId,
      outcome: 'executed',
      detail: 'Opened SW-A2; Closed TS-1. Backfeed active via F3.'
    });
